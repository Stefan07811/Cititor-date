<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b3a">
<title>Cititor Date Fotbal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>⚽ Cititor Date Fotbal</h1>
  <button id="btnSettings" class="icon" aria-label="Setări">⚙️</button>
</header>

<main>
  <section class="card">
    <h2>1. Alege imaginile</h2>
    <label class="btn primary big" for="file">📷 Adaugă imagini</label>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="thumbs" class="thumbs"></div>
    <p id="count" class="muted">Nicio imagine.</p>
  </section>

  <section class="card">
    <h2>2. Extrage informațiile</h2>
    <p id="modeInfo" class="muted"></p>
    <button id="btnRun" class="btn primary big" disabled>🔍 Extrage datele</button>
    <div id="progress" class="progress" hidden><div id="bar"></div></div>
    <p id="status" class="muted"></p>
  </section>

  <section class="card" id="resultCard" hidden>
    <h2>3. Rezultat</h2>
    <p class="muted">Poți edita textul înainte să-l trimiți.</p>
    <textarea id="result" spellcheck="false"></textarea>
    <div class="actions">
      <button id="btnCopy" class="btn">📋 Copiază</button>
      <button id="btnShare" class="btn">📤 Trimite</button>
      <button id="btnTxt" class="btn">⬇️ .txt</button>
      <button id="btnMd" class="btn">⬇️ .md</button>
      <button id="btnPdf" class="btn">📄 PDF</button>
    </div>
  </section>
</main>

<dialog id="dlg">
  <form method="dialog" id="settings">
    <h2>Setări</h2>
    <label>Metodă de citire
      <select id="mode">
        <option value="claude">Claude Vision (exact, recomandat)</option>
        <option value="ocr">OCR local (gratuit, fără cheie, mai puțin exact)</option>
      </select>
    </label>
    <div id="claudeOpts">
      <label>Cheie API Anthropic
        <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      </label>
      <label>Model
        <input id="model" type="text" placeholder="claude-sonnet-5-5">
      </label>
      <p class="muted">Cheia rămâne doar în telefonul tău (localStorage) și este trimisă numai către api.anthropic.com. Imaginile se trimit către Anthropic pentru citire.</p>
    </div>
    <label>Instrucțiune pentru AI-ul care va analiza (se pune la începutul fișierului, opțional)
      <textarea id="preamble" rows="4"></textarea>
    </label>
    <menu><button value="ok" class="btn primary">Salvează</button></menu>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
